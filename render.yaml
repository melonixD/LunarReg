services:
  - type: web
    name: lunarreg
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      - key: MAX_IMAGE_SIDE
        value: "2400"
      - key: MAX_UPLOAD_BYTES
        value: "20971520"
